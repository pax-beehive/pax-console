name: Console checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: console-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  console:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: "--no-experimental-webstorage"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.1"
      - name: Install pnpm
        run: npm install --global pnpm@10.33.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm typecheck
      - name: Lint
        run: pnpm exec eslint src scripts/config-admin-smoke.mjs
      - name: Test and enforce feature/config coverage
        run: >-
          pnpm exec vitest run src --maxWorkers=4 --coverage
          --coverage.include=src/features/flags/use-feature.ts
          --coverage.include=src/features/flags/feature-route.tsx
          --coverage.include=src/features/runtime-config/api.ts
          --coverage.include=src/features/runtime-config/use-runtime-config.ts
          --coverage.thresholds.perFile
          --coverage.thresholds.lines=80
          --coverage.thresholds.statements=80
          --coverage.thresholds.functions=80
          --coverage.thresholds.branches=80
      - name: Test public pages worker
        run: node --test workers/public-pages/index.test.mjs
      - name: Build
        run: pnpm build
